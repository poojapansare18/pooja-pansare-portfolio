name: Import portfolio ZIP

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract portfolio
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          rm -rf /tmp/portfolio
          mkdir -p /tmp/portfolio
          unzip -q "$ZIP_FILE" -d /tmp/portfolio

          ROOT="$(find /tmp/portfolio -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"

          cp -R "$ROOT"/. .
          rm -f "$ZIP_FILE"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import portfolio project" || echo "Nothing to commit"
          git push
